repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.12.2
  hooks:
    # Run the linter.
    - id: ruff-check
    # Run the formatter.
    - id: ruff-format
- repo: local
  hooks:
    - id: eslint
      name: Lint JavaScript
      entry: eslint
      language: node
      language_version: 26.13.1
      types: [javascript]
      files: ^src/app/static/
      additional_dependencies: [eslint@10.15.0]
    - id: stylelint
      name: Lint CSS
      entry: stylelint
      language: node
      language_version: 26.13.1
      types: [css]
      files: ^src/app/static/
      additional_dependencies: [stylelint@16.19.1, stylelint-config-recommended@14.0.1]
    - id: html-validate
      name: Lint HTML
      entry: html-validate
      language: node
      language_version: 26.13.1
      types: [html]
      files: ^src/app/templates/
      additional_dependencies: [html-validate@11.21.1]
    - id: mypy-on-entry
      name: Run mypy on main.py and tests
      entry: uv
      language: system
      types: [python]
      args: [run, mypy, --ignore-missing-imports, src/app/main.py, tests]
      pass_filenames: false
