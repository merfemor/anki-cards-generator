<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anki Cards Generator</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <div class="container">
    <h1>Anki Cards Generator</h1>

    <label>Select Language:</label>
    <div class="btn-group" id="languageGroup">
      <button type="button" class="btn btn-active" data-value="de" data-placeholder="Katze&#10;Hund&#10;Geschwindigkeitsbeschränkung">German</button>
      <button type="button" class="btn" data-value="en" data-placeholder="cat&#10;dog&#10;capybara">English</button>
    </div>

    <label for="words">Enter words (one per line):</label>
    <textarea id="words" placeholder="Katze&#10;Hund&#10;Geschwindigkeitsbeschränkung"></textarea>

    <div class="tip-box">
      <p><strong>Tip:</strong> You can use the <code>=</code> sign to specify a Russian translation hint.</p>
      <p>Example: <code>Katze = кошка</code></p>
    </div>

    <button id="generateBtn">✨ Generate</button>

    <div id="loader">
        ⏳ Generating your Anki cards...<br/>
        <b>Note:</b> response time might be long.
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
