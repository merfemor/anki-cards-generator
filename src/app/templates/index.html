<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anki Cards Generator</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/script.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
</head>
<body>

  <div class="container" x-data="ankiApp()">
    <h1>Anki Cards Generator</h1>

    <label>Select Language:</label>
    <div class="btn-group" id="languageGroup">
      <button type="button" class="btn" :class="{ 'btn-active': language === 'de' }" :disabled="loading" @click="language = 'de'">German</button>
      <button type="button" class="btn" :class="{ 'btn-active': language === 'en' }" :disabled="loading" @click="language = 'en'">English</button>
    </div>

    <label for="wordInput">Enter words:</label>

    <div class="vocab-stack" x-show="items.length > 0">
      <template x-for="(item, index) in items" :key="index">
        <div class="vocab-row">
          <div class="vocab-content">
            <span class="vocab-word" x-text="item.word"></span>
            <span class="hint-badge" x-show="item.hint" x-text="'HINT: ' + item.hint"></span>
          </div>
          <button
            type="button"
            class="btn-delete"
            @click="removeItem(index)"
            :disabled="loading"
            title="Delete row"
            aria-label="Delete row"
          >×</button>
        </div>
      </template>
    </div>

    <input
      id="wordInput"
      type="text"
      x-model="inputValue"
      :placeholder="placeholders[language]"
      :lang="language"
      :disabled="loading"
      @keydown.enter.prevent="addWord()"
      @keydown.backspace="handleBackspace($event)"
      @paste="handlePaste($event)"
      autocomplete="off"
      spellcheck="true"
    />

    <div class="shortcuts-bar">
      <div class="shortcut-item">
        <kbd class="shortcut-key">↵</kbd>
        <span class="shortcut-label">Enter to add row</span>
      </div>
      <div class="shortcut-item">
        <kbd class="shortcut-key">⌫</kbd>
        <span class="shortcut-label">Backspace to edit previous</span>
      </div>
      <div class="shortcut-item">
        <kbd class="shortcut-key">📋</kbd>
        <span class="shortcut-label">Paste multiline text</span>
      </div>
      <div class="shortcut-item">
        <kbd class="shortcut-key">=</kbd>
        <span class="shortcut-label">Add optional Russian translation hint (e.g. Katze = кошка)</span>
      </div>
    </div>

    <button id="generateBtn" type="button" :disabled="!canGenerate" @click="onGenerateButtonClick()">✨ Generate</button>

    <div id="loader" x-show="loading" x-cloak>
        ⏳ Generating your Anki cards...<br/>
        <b>Note:</b> response time might be long.
    </div>
  </div>
</body>
</html>
