[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "flask[async] (==3.1.3)",
    "genanki (==0.13.1)",
    "german-nouns (==1.2.5)",
    "ollama (==0.6.3)",
    "openai (==3.28.0)",
    "python-dotenv (==1.2.4)",
    "HanTa (==1.2.1)",
    "numpy (==2.4.4)",
    "pyspellchecker (==0.9.1)",
    "deepl (==1.32.0)",
    "pydantic (==2.14.0)",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-timeout==2.4.0",
]

[tool.uv]
default-groups = "all"

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
timeout = 5
